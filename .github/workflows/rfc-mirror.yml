name: Sync SSH RFC mirror

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - rfc-mirror
    paths:
      - rfc/MANIFEST.tsv
      - rfc/update.sh
      - .github/workflows/rfc-mirror.yml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirror:
    name: Mirror RFC Editor text
    permissions:
      contents: write # Required to commit refreshed RFC mirror bytes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # zizmor: ignore[artipacked] credential is intentionally retained for the final git push below

      - name: Fetch canonical RFC Editor text
        run: sh rfc/update.sh

      - name: Commit mirror bytes
        shell: sh
        run: |
          git add rfc/text rfc/SHA256SUMS
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh SSH RFC mirror'
          git push origin "HEAD:${GITHUB_REF_NAME}"
