name: ai-ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: ai-ci contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: isomorphisms/ai-ci@4f5c0a7294cab4a915581413fbf0df3ed25121f0 # zizmor: ignore[stale-action-refs,ref-version-mismatch] exact reviewed commit, not a release tag
        with:
          suite: ci/ai-ci.suite.tsv
          root: .
